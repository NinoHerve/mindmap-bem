name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # VTK (through pyvista) needs OpenGL libraries even when nothing is rendered
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1

      # install the built wheel, as users get it from PyPI, not the source tree
      - name: Build and install
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install "$(ls dist/*.whl)[test]"

      - name: Run tests
        run: |
          pip list | grep -iE "^(numpy|scipy|nibabel|pyvista|vtk|mne) "
          pytest -v
